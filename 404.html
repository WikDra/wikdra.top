<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - But odleciał | Wikdra.top</title>
    <link rel="icon" href="https://yt3.googleusercontent.com/ytc/AIdro_nqg9KuS9FqyQSTFPyFxH9lx-5ZbgQh5YlEKEyWaXkVs5Y=s512-c-k-c0x00ffffff-no-rj">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Shared themes CSS -->
    <link rel="stylesheet" href="/themes.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Theme Helper & Anti-FOUC Script -->
    <script>
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        function getGlobalTheme() {
            return getCookie('global_theme') || localStorage.getItem('global_theme') || 'brutalist';
        }
        function setGlobalTheme(val) {
            localStorage.setItem('global_theme', val);
            if (window.location.hostname.endsWith('wikdra.top')) {
                // Delete host-specific cookie to prevent shadowing
                document.cookie = "global_theme=;path=/;max-age=0;SameSite=Lax";
                // Set wildcard cookie for subdomain sharing
                document.cookie = "global_theme=" + val + ";path=/;domain=.wikdra.top;max-age=31536000;SameSite=Lax";
            } else {
                document.cookie = "global_theme=" + val + ";path=/;max-age=31536000;SameSite=Lax";
            }
        }
        document.documentElement.className = 'theme-' + getGlobalTheme();
    </script>

    <style>
        .shoe-fly {
            animation: fly 4s infinite ease-in-out;
        }

        @keyframes fly {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, -25px) rotate(45deg); }
            50% { transform: translate(100px, 0px) rotate(90deg); }
            75% { transform: translate(50px, 25px) rotate(135deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body x-data="{ currentTheme: getGlobalTheme() }" 
      :class="'theme-' + currentTheme" 
      class="h-full flex items-center justify-center p-4 transition-colors duration-300 relative text-center"
      x-init="
        $watch('currentTheme', val => {
            document.documentElement.className = 'theme-' + val;
            setGlobalTheme(val);
        });
      ">
    
    <!-- Aurora background blobs -->
    <div x-show="currentTheme === 'aurora'" class="pointer-events-none absolute inset-0 overflow-hidden z-0">
        <div class="absolute top-1/4 left-1/4 h-80 w-80 rounded-full bg-violet-300/40 blur-3xl animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 h-80 w-80 rounded-full bg-sky-300/40 blur-3xl animate-pulse" style="animation-delay: 1.5s;"></div>
    </div>

    <!-- Cyberpunk grid/glow -->
    <div x-show="currentTheme === 'cyberpunk'" class="pointer-events-none absolute inset-0 overflow-hidden z-0"
         style="background-image: linear-gradient(rgba(217,70,239,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px); background-size: 34px 34px;">
    </div>

    <!-- Main Container -->
    <div class="panel-card max-w-lg p-8 sm:p-12 z-10 w-full flex flex-col items-center relative"
         :class="currentTheme === 'terminal' ? 'bg-black/60 backdrop-blur-sm' : ''">
         
         <!-- Cyberpunk corners -->
         <template x-if="currentTheme === 'cyberpunk'">
             <div class="absolute inset-0 pointer-events-none">
                 <span class="absolute left-0 top-0 h-3 w-3 border-l-2 border-t-2 border-cyan-400"></span>
                 <span class="absolute right-0 top-0 h-3 w-3 border-r-2 border-t-2 border-cyan-400"></span>
                 <span class="absolute bottom-0 left-0 h-3 w-3 border-b-2 border-l-2 border-cyan-400"></span>
                 <span class="absolute bottom-0 right-0 h-3 w-3 border-b-2 border-r-2 border-cyan-400"></span>
             </div>
         </template>

         <!-- Shoe Icon -->
         <div class="shoe-fly text-5xl mb-6 flex justify-center items-center h-16 w-16"
              :class="{
                'text-black border-4 border-black bg-orange-400 p-2 shadow-[2px_2px_0_#000] rounded-none': currentTheme === 'brutalist',
                'text-fuchsia-400 border border-fuchsia-400/50 bg-fuchsia-500/10 p-2 rounded-md shadow-[0_0_10px_rgba(217,70,239,0.5)]': currentTheme === 'cyberpunk',
                'text-emerald-400': currentTheme === 'terminal',
                'text-white bg-gradient-to-br from-indigo-500 to-pink-500 shadow-md rounded-2xl': currentTheme === 'aurora',
                'text-neutral-400': currentTheme === 'editorial'
              }">
             <i class="fas fa-shoe-prints"></i>
         </div>

         <!-- Error Code -->
         <div class="text-7xl sm:text-8xl font-black mb-2"
              :class="{
                'text-black uppercase': currentTheme === 'brutalist',
                'text-cyan-300 font-mono shadow-cyan-300': currentTheme === 'cyberpunk',
                'text-emerald-300 font-mono': currentTheme === 'terminal',
                'bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent': currentTheme === 'aurora',
                'text-neutral-900 font-serif font-semibold': currentTheme === 'editorial'
              }"
              :style="currentTheme === 'cyberpunk' ? 'text-shadow: 0 0 15px rgba(34,211,238,0.6);' : ''">404</div>

         <!-- Red Alert Subheading -->
         <div class="text-lg sm:text-xl font-black text-red-500 tracking-wider uppercase mb-6"
              :class="currentTheme === 'terminal' || currentTheme === 'cyberpunk' ? 'font-mono' : ''">
             UPOŚLEDZENIE W STOPNIU KRYTYCZNYM
         </div>

         <!-- Heading message -->
         <h1 class="text-xl sm:text-2xl font-bold mb-4"
             :class="{
               'text-black font-black uppercase': currentTheme === 'brutalist',
               'text-white font-mono uppercase': currentTheme === 'cyberpunk',
               'text-emerald-300 font-mono': currentTheme === 'terminal',
               'text-slate-900': currentTheme === 'aurora',
               'text-neutral-900 font-serif italic': currentTheme === 'editorial'
             }">
             Ups! But odleciał za daleko.
         </h1>

         <!-- Description -->
         <p class="text-sm leading-relaxed mb-8 max-w-sm"
            :class="{
              'text-black font-semibold': currentTheme === 'brutalist',
              'text-white/60 font-mono': currentTheme === 'cyberpunk',
              'text-emerald-400/80 font-mono': currentTheme === 'terminal',
              'text-slate-600': currentTheme === 'aurora',
              'text-neutral-500': currentTheme === 'editorial'
            }">
             Strona, której szukasz, prawdopodobnie została zrzucona z kiblem na telefon lub po prostu nie istnieje.
         </p>

         <!-- CTA button -->
         <a href="https://wikdra.top" class="theme-btn py-3 px-6 text-sm">
             Wróć na ziemię
         </a>
    </div>

    <!-- GLOBAL FLOATING THEME SWITCHER -->
    <div x-data="{ open: false }" class="fixed bottom-5 right-5 z-50 font-sans">
        <!-- Button -->
        <button @click="open = !open" 
                :class="{
                  'border-4 border-black bg-yellow-300 text-black shadow-[4px_4px_0_#000] hover:shadow-[6px_6px_0_#000]': currentTheme === 'brutalist',
                  'border border-cyan-400 bg-black text-cyan-300 shadow-[0_0_10px_rgba(34,211,238,0.5)] hover:border-fuchsia-400 hover:text-fuchsia-300': currentTheme === 'cyberpunk',
                  'border border-emerald-500 bg-black text-emerald-400 hover:bg-emerald-500/10': currentTheme === 'terminal',
                  'bg-white/70 border border-white/60 text-slate-700 shadow-lg backdrop-blur-md hover:bg-white': currentTheme === 'aurora',
                  'border border-neutral-300 bg-white text-neutral-800 hover:bg-neutral-50': currentTheme === 'editorial'
                }"
                class="flex h-12 w-12 items-center justify-center rounded-full transition-all duration-200 focus:outline-none">
            <i class="fas fa-cog text-lg transition-transform duration-500" :class="open ? 'rotate-90' : ''"></i>
        </button>

        <!-- Dropdown Panel -->
        <div x-show="open" 
             @click.away="open = false"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95 translate-y-2"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-75"
             x-transition:leave-start="opacity-100 scale-100 translate-y-0"
             x-transition:leave-end="opacity-0 scale-95 translate-y-2"
             :class="{
               'border-4 border-black bg-white text-black shadow-[6px_6px_0_#000]': currentTheme === 'brutalist',
               'border border-cyan-400/80 bg-[#05010f] text-white shadow-[0_0_15px_rgba(34,211,238,0.3)]': currentTheme === 'cyberpunk',
               'border border-emerald-500 bg-black text-emerald-400': currentTheme === 'terminal',
               'bg-white/95 border border-white/60 text-slate-800 shadow-2xl backdrop-blur-xl rounded-2xl': currentTheme === 'aurora',
               'border border-neutral-200 bg-white text-neutral-900 rounded-md': currentTheme === 'editorial'
             }"
             class="absolute bottom-14 right-0 mt-2 w-56 p-3 flex flex-col gap-1.5 focus:outline-none select-none">
             
             <div class="px-2 py-1 text-xs font-bold uppercase tracking-wider opacity-60"
                  :class="currentTheme === 'terminal' || currentTheme === 'cyberpunk' ? 'text-white/50' : 'text-neutral-500'">
                  Styl strony:
             </div>
             
             <!-- Brutalist -->
             <button @click="currentTheme = 'brutalist'; open = false"
                     :class="currentTheme === 'brutalist' ? 'bg-lime-300 text-black border-2 border-black font-bold shadow-[2px_2px_0_#000]' : 'hover:bg-neutral-100 text-neutral-700'"
                     class="flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-all duration-150 rounded-lg">
                     <span class="inline-block w-3.5 h-3.5 rounded-full border border-black bg-[#fdf6e3]"></span>
                     Neo-Brutalizm
             </button>
             
             <!-- Cyberpunk -->
             <button @click="currentTheme = 'cyberpunk'; open = false"
                     :class="currentTheme === 'cyberpunk' ? 'bg-fuchsia-500 text-white border border-fuchsia-300 shadow-[0_0_8px_rgba(217,70,239,0.6)] font-bold' : 'hover:bg-white/5 text-neutral-300'"
                     class="flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-all duration-150 rounded-lg">
                     <span class="inline-block w-3.5 h-3.5 rounded-full border border-cyan-400 bg-cyan-400 shadow-[0_0_5px_#22d3ee]"></span>
                     Cyber Dashboard
             </button>
             
             <!-- Terminal -->
             <button @click="currentTheme = 'terminal'; open = false"
                     :class="currentTheme === 'terminal' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400 font-bold' : 'hover:bg-emerald-500/10 text-emerald-400/70'"
                     class="flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-all duration-150 rounded-lg">
                     <span class="inline-block w-3.5 h-3.5 rounded bg-emerald-500 border border-emerald-400"></span>
                     Dev Terminal
             </button>
             
             <!-- Aurora -->
             <button @click="currentTheme = 'aurora'; open = false"
                     :class="currentTheme === 'aurora' ? 'bg-indigo-600 text-white font-bold' : 'hover:bg-slate-100 text-slate-700'"
                     class="flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-all duration-150 rounded-lg">
                     <span class="inline-block w-3.5 h-3.5 rounded-full bg-gradient-to-tr from-indigo-500 to-pink-500 shadow"></span>
                     Glassmorphism
             </button>
             
             <!-- Editorial -->
             <button @click="currentTheme = 'editorial'; open = false"
                     :class="currentTheme === 'editorial' ? 'bg-neutral-900 text-white font-bold' : 'hover:bg-neutral-100 text-neutral-700'"
                     class="flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-all duration-150 rounded-lg">
                     <span class="inline-block w-3.5 h-3.5 rounded-full border border-neutral-300 bg-white shadow-sm"></span>
                     Editorial
             </button>
        </div>
    </div>
</body>
</html>
