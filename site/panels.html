<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Forecast Dashboard</title>
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw-v6.js')
                    .then(reg => reg.update())
                    .catch(err => console.log('PWA: Błąd ServiceWorkera:', err));
            });
        }
    </script>

    <link rel="stylesheet" href="/assets/css/uplot.min.css">
    <link rel="stylesheet" href="/assets/css/app-v6.css">
    <script src="/assets/js/uPlot.iife.min.js"></script>
    <script defer src="/assets/js/alpine.min.js"></script>

    <!-- Theme init (anti-FOUC) -->
    <script>
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        function getSystemPreferredThemeAndMode() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            return { theme: isDark ? 'terminal' : 'brutalist', mode: isDark ? 'dark' : 'light' };
        }
        function getGlobalTheme() {
            return getCookie('global_theme') || localStorage.getItem('global_theme') || getSystemPreferredThemeAndMode().theme;
        }
        function getGlobalMode() {
            let mode = getCookie('global_mode') || localStorage.getItem('global_mode');
            if (mode) return mode;
            let hasTheme = getCookie('global_theme') || localStorage.getItem('global_theme');
            if (hasTheme) {
                let theme = getGlobalTheme();
                return (theme === 'brutalist' || theme === 'editorial') ? 'light' : 'dark';
            }
            return getSystemPreferredThemeAndMode().mode;
        }
        function setGlobal(key, val) {
            localStorage.setItem(key, val);
            if (window.location.hostname.endsWith('wikdra.top')) {
                document.cookie = key + "=;path=/;max-age=0;SameSite=Lax";
                document.cookie = key + "=" + val + ";path=/;domain=.wikdra.top;max-age=31536000;SameSite=Lax";
            } else {
                document.cookie = key + "=" + val + ";path=/;max-age=31536000;SameSite=Lax";
            }
        }
        (function () {
            const el = document.documentElement;
            el.dataset.theme = getGlobalTheme();
            el.dataset.mode = getGlobalMode();
        })();
    </script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('solarApp', () => ({
                theme: getGlobalTheme(),
                mode: getGlobalMode(),
                themes: [
                    { key: 'brutalist', name: 'Neo-Brutalizm', color: '#eab308' },
                    { key: 'cyberpunk', name: 'Cyber Dashboard', color: '#22d3ee' },
                    { key: 'terminal', name: 'Dev Terminal', color: '#34d399' },
                    { key: 'aurora', name: 'Glassmorphism', color: '#a855f7' },
                    { key: 'editorial', name: 'Editorial', color: '#171717' }
                ],
                loading: false,
                selectedDate: '',
                params: { lat: 50.482, lon: 21.315, dec: 30, az: 0, kwp: 8, limit: 5500 },
                address: '',
                stats: { peakPower: 0, lastUpdate: 'Nigdy' },
                history: {},
                hourlyData: {},
                chart: null,

                applyTheme() {
                    const el = document.documentElement;
                    el.dataset.theme = this.theme;
                    el.dataset.mode = this.mode;
                    setGlobal('global_theme', this.theme);
                    setGlobal('global_mode', this.mode);
                    this.$nextTick(() => this.refreshChart());
                },
                setTheme(val) {
                    this.theme = val;
                    this.mode = (val === 'brutalist' || val === 'editorial') ? 'light' : 'dark';
                    this.applyTheme();
                },
                setMode(val) {
                    this.mode = val;
                    this.applyTheme();
                },

                async init() {
                    this.loadFromStorage();
                    const urlParams = new URLSearchParams(window.location.search);
                    const dateParam = urlParams.get('date');
                    const today = this.formatLocalDate(new Date());
                    if (dateParam && this.history[dateParam]) {
                        this.selectedDate = dateParam;
                    } else if (!this.selectedDate) {
                        this.selectedDate = today;
                    }
                    window.addEventListener('resize', () => {
                        if (this.chart) {
                            const el = document.getElementById('forecastChart');
                            if (el) this.chart.setSize({ width: el.clientWidth, height: el.clientHeight });
                        }
                    });
                    await this.fetchData();
                },

                loadFromStorage() {
                    const savedParams = localStorage.getItem('solar_params');
                    if (savedParams) this.params = JSON.parse(savedParams);
                    const savedHistory = localStorage.getItem('solar_history');
                    if (savedHistory) this.history = JSON.parse(savedHistory);
                    const lastUpdate = localStorage.getItem('solar_last_update');
                    if (lastUpdate) this.stats.lastUpdate = lastUpdate;
                },

                saveToStorage() {
                    localStorage.setItem('solar_params', JSON.stringify(this.params));
                    localStorage.setItem('solar_history', JSON.stringify(this.history));
                    localStorage.setItem('solar_last_update', this.stats.lastUpdate);
                },

                async lookupAddress() {
                    if (!this.address) return;
                    this.loading = true;
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.address)}`);
                        const data = await response.json();
                        if (data && data.length > 0) {
                            this.params.lat = parseFloat(data[0].lat).toFixed(3);
                            this.params.lon = parseFloat(data[0].lon).toFixed(3);
                            this.saveToStorage();
                        } else {
                            alert('Nie znaleziono adresu');
                        }
                    } catch (error) {
                        alert('Błąd wyszukiwania adresu');
                    } finally {
                        this.loading = false;
                    }
                },

                async fetchData() {
                    this.loading = true;
                    const url = `https://api.forecast.solar/estimate/${this.params.lat}/${this.params.lon}/${this.params.dec}/${this.params.az}/${this.params.kwp}`;
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        this.processIncomingData(data.result);
                        this.stats.lastUpdate = new Date().toLocaleString('pl-PL');
                        this.saveToStorage();
                    } catch (error) {
                        console.error('Błąd pobierania danych:', error);
                    } finally {
                        this.loading = false;
                        this.refreshView();
                    }
                },

                processIncomingData(result) {
                    const watts = result.watts;
                    const dailyEnergy = result.watt_hours_day;
                    Object.entries(dailyEnergy).forEach(([date, wh]) => {
                        const dayWatts = {};
                        Object.entries(watts).forEach(([time, w]) => {
                            if (time.startsWith(date)) dayWatts[time] = w;
                        });
                        this.history[date] = {
                            energy: (wh / 1000).toFixed(2),
                            watts: dayWatts,
                            params: { ...this.params }
                        };
                    });
                },

                refreshView() {
                    const dayData = this.history[this.selectedDate];
                    if (!dayData) {
                        this.hourlyData = {};
                        this.stats.peakPower = 0;
                        this.refreshChart();
                        return;
                    }
                    const limit = this.params.limit;
                    const clippedWatts = {};
                    let peak = 0;
                    Object.entries(dayData.watts).forEach(([time, watt]) => {
                        const clipped = Math.min(watt, limit);
                        clippedWatts[time] = clipped;
                        if (clipped > peak) peak = clipped;
                    });
                    this.hourlyData = clippedWatts;
                    this.stats.peakPower = peak;
                    this.$nextTick(() => this.refreshChart());
                },

                chartColors() {
                    const styles = getComputedStyle(document.documentElement);
                    const accent = styles.getPropertyValue('--accent').trim() || '#eab308';
                    const accent2 = styles.getPropertyValue('--accent-2').trim() || '#22d3ee';
                    const muted = styles.getPropertyValue('--muted').trim() || '#64748b';
                    const line = styles.getPropertyValue('--line').trim() || 'rgba(128,128,128,0.2)';
                    const font = styles.getPropertyValue('--font-body').trim() || 'sans-serif';
                    const isLight = this.mode === 'light';
                    return {
                        line: accent,
                        fillTop: accent.startsWith('#') ? accent + '44' : 'rgba(34,211,238,0.25)',
                        grid: line,
                        tick: muted,
                        limit: accent2,
                        font: font,
                        pointFill: accent,
                        pointStroke: isLight ? (this.theme === 'brutalist' ? '#000000' : '#ffffff') : '#000000'
                    };
                },

                refreshChart() {
                    const el = document.getElementById('forecastChart');
                    if (this.chart) { this.chart.destroy(); this.chart = null; }
                    if (!el) return;
                    const watts = this.hourlyData;
                    if (!watts || Object.keys(watts).length === 0) return;

                    const times = Object.keys(watts).map(t => Math.floor(new Date(t.replace(' ', 'T')).getTime() / 1000));
                    const values = Object.values(watts);
                    const limitArr = times.map(() => this.params.limit);
                    const c = this.chartColors();

                    const tooltipPlugin = () => {
                        let tooltipEl;
                        return {
                            hooks: {
                                init(u) {
                                    tooltipEl = document.createElement("div");
                                    tooltipEl.className = "uplot-tooltip";
                                    tooltipEl.style.display = "none";
                                    tooltipEl.style.position = "absolute";
                                    tooltipEl.style.pointerEvents = "none";
                                    tooltipEl.style.zIndex = "100";
                                    u.over.appendChild(tooltipEl);
                                },
                                setCursor(u) {
                                    const { left, top, idx } = u.cursor;
                                    if (idx === null || idx === undefined) {
                                        tooltipEl.style.display = "none";
                                        return;
                                    }
                                    const timeSec = u.data[0][idx];
                                    const wattVal = u.data[1][idx];
                                    const limitVal = u.data[2][idx];
                                    if (wattVal === undefined) {
                                        tooltipEl.style.display = "none";
                                        return;
                                    }
                                    const dateObj = new Date(timeSec * 1000);
                                    const timeStr = dateObj.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit', hour12: false });
                                    
                                    tooltipEl.innerHTML = `<div class="uplot-tooltip-time">Godzina ${timeStr}</div>` +
                                                           `<div class="uplot-tooltip-val">Moc: <strong>${wattVal} W</strong></div>` +
                                                           (wattVal >= limitVal ? `<div class="uplot-tooltip-limit">Limit Falownika</div>` : '');
                                    
                                    tooltipEl.style.display = "block";
                                    const overRect = u.over.getBoundingClientRect();
                                    let x = left + 14;
                                    let y = top - 30;
                                    if (x + 130 > overRect.width) x = left - 130;
                                    if (y < 10) y = top + 15;
                                    tooltipEl.style.left = x + "px";
                                    tooltipEl.style.top = y + "px";
                                }
                            }
                        };
                    };

                    this.chart = new uPlot({
                        width: el.clientWidth,
                        height: el.clientHeight,
                        legend: { show: false },
                        scales: { x: { time: true } },
                        axes: [
                            {
                                stroke: c.tick,
                                font: `11px ${c.font}`,
                                grid: { show: false },
                                ticks: { stroke: c.grid },
                                values: (self, splits) => splits.map(ts => {
                                    const d = new Date(ts * 1000);
                                    const h = String(d.getHours()).padStart(2, '0');
                                    const m = String(d.getMinutes()).padStart(2, '0');
                                    return `${h}:${m}`;
                                })
                            },
                            { stroke: c.tick, font: `11px ${c.font}`, grid: { stroke: c.grid, width: 1 }, ticks: { stroke: c.grid } }
                        ],
                        plugins: [tooltipPlugin()],
                        series: [
                            {},
                            {
                                label: 'Moc (W)',
                                stroke: c.line,
                                width: 2.5,
                                fill: (u) => {
                                    const gradient = u.ctx.createLinearGradient(0, 0, 0, u.bbox.height);
                                    gradient.addColorStop(0, c.fillTop);
                                    gradient.addColorStop(1, 'transparent');
                                    return gradient;
                                },
                                points: {
                                    show: (u, seriesIdx, idx) => u.cursor.idx === idx,
                                    size: 9,
                                    width: 2.5,
                                    stroke: c.pointStroke,
                                    fill: c.pointFill
                                }
                            },
                            { label: 'Limit', stroke: c.limit, width: 1.5, dash: [6, 4], points: { show: false } }
                        ]
                    }, [times, values, limitArr], el);
                },

                formatLocalDate(d) {
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },

                selectDate(date) {
                    this.selectedDate = date;
                    this.refreshView();
                },

                selectDateByDayType(dayType) {
                    const d = new Date();
                    if (dayType === 'tomorrow') d.setDate(d.getDate() + 1);
                    this.selectDate(this.formatLocalDate(d));
                },

                isDateSelected(dayType) {
                    const d = new Date();
                    if (dayType === 'tomorrow') d.setDate(d.getDate() + 1);
                    return this.selectedDate === this.formatLocalDate(d);
                },

                getSortedHistoryDates() {
                    return Object.keys(this.history).sort().reverse();
                },

                exportHistory() {
                    if (!this.history || Object.keys(this.history).length === 0) {
                        alert('Brak danych historii do wyeksportowania.');
                        return;
                    }
                    const exportData = {
                        version: "1.0",
                        exportDate: new Date().toISOString(),
                        params: this.params,
                        stats: this.stats,
                        history: this.history
                    };
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
                    const a = document.createElement('a');
                    a.setAttribute("href", dataStr);
                    a.setAttribute("download", `solar_history_${new Date().toISOString().split('T')[0]}.json`);
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                },

                importHistory(event) {
                    const file = event.target.files && event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            let importedHistory = null;
                            let importedParams = null;
                            if (imported && imported.history && typeof imported.history === 'object') {
                                importedHistory = imported.history;
                                if (imported.params && typeof imported.params === 'object') importedParams = imported.params;
                            } else if (imported && imported.solar_history && typeof imported.solar_history === 'object') {
                                importedHistory = imported.solar_history;
                            } else if (imported && typeof imported === 'object') {
                                importedHistory = imported;
                            }
                            if (!importedHistory || Object.keys(importedHistory).length === 0) {
                                alert('Nieprawidłowy format pliku JSON lub brak wpisów w historii.');
                                return;
                            }
                            let countNew = 0, countMerged = 0;
                            Object.keys(importedHistory).forEach(date => {
                                if (!this.history[date]) {
                                    this.history[date] = importedHistory[date];
                                    countNew++;
                                } else {
                                    const existingWatts = this.history[date].watts || {};
                                    const newWatts = importedHistory[date].watts || {};
                                    this.history[date] = { ...this.history[date], ...importedHistory[date], watts: { ...existingWatts, ...newWatts } };
                                    countMerged++;
                                }
                            });
                            if (importedParams) this.params = { ...this.params, ...importedParams };
                            const dates = this.getSortedHistoryDates();
                            if (dates.length > 0 && (!this.selectedDate || !this.history[this.selectedDate])) this.selectedDate = dates[0];
                            this.saveToStorage();
                            this.refreshView();
                            alert(`Pomyślnie scalono historię! (Nowe dni: ${countNew}, zaktualizowane: ${countMerged})`);
                        } catch (err) {
                            alert('Błąd odczytu pliku JSON. Upewnij się, że plik ma poprawną strukturę JSON.');
                        } finally {
                            event.target.value = '';
                        }
                    };
                    reader.readAsText(file);
                }
            }));
        });
    </script>
</head>
<body x-data="solarApp" class="min-h-screen p-4 md:p-8 relative">

    <!-- Background decoration (CSS-controlled per theme) -->
    <div class="bg-decoration" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="cyber-grid"></div>
        <div class="cyber-scanlines"></div>
        <div class="cyber-glow"></div>
        <div class="cyber-sun"></div>
    </div>

    <div class="max-w-6xl mx-auto z-10 relative space-y-8">

        <!-- HEADER -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4">
            <div>
                <a href="/" class="page-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
                    <span>SolarForecast</span>
                </a>
                <p class="page-subtitle">Pełna analiza Twojej produkcji słonecznej</p>
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-3 flex-nowrap w-full sm:w-auto shrink-0">
                <div class="pill" x-data="{ expanded: false }" @click="expanded = !expanded" :class="{ 'expanded': expanded }" title="Kliknij, aby rozwinąć / zwinąć">
                    <span class="dot" :class="{ 'loading': loading }"></span>
                    <span x-text="loading ? 'Pobieranie danych...' : 'Aktualizacja: ' + stats.lastUpdate"></span>
                </div>

                <!-- THEME SWITCHER (in flow) -->
                <div class="switcher" x-data="{ open: false }">
                    <button class="switcher-btn" @click="open = !open" :data-open="open" aria-label="Zmień motyw">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                    <div class="switcher-panel" x-show="open" @click.away="open = false" x-transition.origin.top.right style="display: none;">
                        <div class="switcher-title">Styl strony:</div>
                        <template x-for="t in themes" :key="t.key">
                            <button class="switcher-item" :class="{ 'active': theme === t.key }" @click="setTheme(t.key); open = false">
                                <span class="switcher-dot" :style="'background:' + t.color"></span>
                                <span x-text="t.name"></span>
                            </button>
                        </template>
                        <div class="switcher-sep"></div>
                        <div class="switcher-title">Tryb:</div>
                        <button class="switcher-item" :class="{ 'active': mode === 'light' }" @click="setMode('light'); open = false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="switcher-dot" style="background:none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
                            Jasny
                        </button>
                        <button class="switcher-item" :class="{ 'active': mode === 'dark' }" @click="setMode('dark'); open = false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="switcher-dot" style="background:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
                            Ciemny
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- DASHBOARD GRID -->
        <main class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- SIDEBAR -->
            <aside class="lg:col-span-1 space-y-6">

                <!-- API PARAMETERS CARD -->
                <div class="panel-card p-6">
                    <h2 class="text-lg font-bold mb-4">Parametry API</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="label-tiny">Wyszukaj adres</label>
                            <div class="search-box-row flex gap-2">
                                <input type="text" x-model="address" @keydown.enter="lookupAddress" placeholder="Miasto, ulica..." class="theme-input">
                                <button @click="lookupAddress" class="theme-btn px-3" aria-label="Szukaj">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="height:0.9em;width:0.9em"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="label-tiny">Szerokość</label>
                                <input type="number" x-model="params.lat" step="0.001" class="theme-input">
                            </div>
                            <div>
                                <label class="label-tiny">Długość</label>
                                <input type="number" x-model="params.lon" step="0.001" class="theme-input">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="label-tiny">Nachylenie</label>
                                <input type="number" x-model="params.dec" class="theme-input">
                            </div>
                            <div>
                                <label class="label-tiny">Azymut</label>
                                <input type="number" x-model="params.az" class="theme-input">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="label-tiny">Moc (kWp)</label>
                                <input type="number" x-model="params.kwp" step="0.1" class="theme-input">
                            </div>
                            <div>
                                <label class="label-tiny">Limit (W)</label>
                                <input type="number" x-model="params.limit" @input="refreshView()" class="theme-input">
                            </div>
                        </div>

                        <button @click="fetchData" :disabled="loading" class="theme-btn w-full py-2.5 px-4 mt-2 text-xs tracking-wider">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="mr-1.5" :class="{ 'spin-icon': loading }"><path d="M21 12a9 9 0 1 1-6.2-8.56"/><path d="M21 3v6h-6"/></svg>
                            <span>Wyślij zapytanie</span>
                        </button>
                    </div>
                </div>

                <!-- HISTORY CARD -->
                <div class="panel-card p-6">
                    <div class="flex flex-col gap-2.5 mb-4">
                        <h2 class="text-lg font-bold">Historia Dni</h2>
                        <div class="flex items-center gap-1.5 select-none w-full history-actions-row">
                            <button @click="exportHistory()" title="Eksportuj historię do pliku JSON" class="theme-btn flex-1 text-center justify-center px-1 py-1 text-[0.65rem] tracking-tight whitespace-nowrap min-w-0">Eksport</button>
                            <label title="Importuj i scal historię z pliku JSON" class="theme-btn flex-1 text-center justify-center px-1 py-1 text-[0.65rem] tracking-tight cursor-pointer whitespace-nowrap min-w-0">
                                Import
                                <input type="file" accept=".json" @change="importHistory($event)" class="hidden">
                            </label>
                            <a href="/history.html" title="Zobacz pełną historię i archiwum wpisów" class="theme-btn flex-1 text-center justify-center px-1 py-1 text-[0.65rem] tracking-tight whitespace-nowrap min-w-0" style="text-decoration:none">Wszystkie</a>
                        </div>
                    </div>

                    <div class="history-list select-none">
                        <template x-for="date in getSortedHistoryDates()" :key="date">
                            <button @click="selectDate(date)" class="list-btn" :class="{ 'active': selectedDate === date }">
                                <div class="flex flex-col">
                                    <span x-text="date"></span>
                                    <span class="text-[10px] opacity-60">Produkcja całkowita</span>
                                </div>
                                <span class="energy" x-text="history[date].energy + ' kWh'"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <section class="lg:col-span-3 space-y-6">

                <!-- TOP BAR: DAY SWITCHER & ACTIVE DATE -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 select-none">
                    <div class="tab-group">
                        <div class="tab-slider" :data-tab="isDateSelected('tomorrow') ? 'tomorrow' : 'today'" :data-visible="(isDateSelected('today') || isDateSelected('tomorrow')).toString()"></div>
                        <button @click="selectDateByDayType('today')" class="tab-btn" :class="{ 'active': isDateSelected('today') }">Dzisiaj</button>
                        <button @click="selectDateByDayType('tomorrow')" class="tab-btn" :class="{ 'active': isDateSelected('tomorrow') }">Jutro</button>
                    </div>
                    <div class="pill">
                        Podgląd dla: <span x-text="selectedDate" class="font-bold"></span>
                    </div>
                </div>

                <!-- STATS CARDS -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="panel-card p-6">
                        <p class="stat-label mb-1">Energia całkowita</p>
                        <div class="flex items-baseline gap-1">
                            <span class="stat-value" x-text="history[selectedDate]?.energy || 0"></span>
                            <span class="text-xs opacity-60 uppercase font-bold">kWh</span>
                        </div>
                    </div>
                    <div class="panel-card p-6">
                        <p class="stat-label mb-1">Moc szczytowa</p>
                        <div class="flex items-baseline gap-1">
                            <span class="stat-value" x-text="stats.peakPower"></span>
                            <span class="text-xs opacity-60 uppercase font-bold">W</span>
                        </div>
                    </div>
                    <div class="panel-card p-6 relative overflow-hidden">
                        <p class="stat-label mb-1">Limit falownika</p>
                        <div class="flex items-baseline gap-1">
                            <span class="stat-value opacity-80" x-text="params.limit"></span>
                            <span class="text-xs opacity-60 uppercase font-bold">W</span>
                        </div>
                        <div x-show="stats.peakPower >= params.limit" class="badge-limit" style="display: none;">Limit!</div>
                    </div>
                </div>

                <!-- CHART CARD -->
                <div class="panel-card p-6 min-h-[400px]">
                    <div class="chart-box" id="forecastChart"></div>
                </div>

                <!-- TABLE CARD -->
                <div class="panel-card overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="text-[10px] uppercase">
                            <tr>
                                <th class="p-4">Godzina</th>
                                <th class="p-4">Moc (W)</th>
                                <th class="p-4">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(val, time) in hourlyData" :key="time">
                                <tr class="text-sm">
                                    <td class="p-4 font-medium" x-text="time.split(' ')[1].substring(0,5)"></td>
                                    <td class="p-4 font-bold" :class="{ 'limit-hit': val >= params.limit }" x-text="val"></td>
                                    <td class="p-4">
                                        <span x-show="val >= params.limit" class="clipping-badge" style="display: none;">Clipping</span>
                                        <span x-show="val > 0 && val < params.limit" class="status-ok-badge" style="display: none;">OK</span>
                                        <span x-show="val === 0" class="text-xs opacity-40 font-mono">—</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
