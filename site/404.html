<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - But odleciał | Wikdra.top</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">

    <!-- Motyw: wspólny moduł (wcześniej piąta kopia tej samej logiki inline) -->
    <script src="/assets/js/theme.js"></script>

    <link rel="stylesheet" href="/assets/css/app-v6.css">
    <style>
        .shoe-fly {
            animation: fly 4s infinite ease-in-out;
            transform-origin: center center;
        }
        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-14px) rotate(-8deg); }
            50% { transform: translateY(-24px) rotate(4deg); }
            75% { transform: translateY(-10px) rotate(-4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) { .shoe-fly { animation: none; } }
        .error-code { font-size: clamp(4rem, 15vw, 7rem); font-weight: 900; line-height: 1; }
        html[data-theme="cyberpunk"][data-mode="dark"] .error-code { color: var(--accent); text-shadow: 0 0 15px rgba(34,211,238,0.6); }
        html[data-theme="aurora"][data-mode="dark"] .error-code {
            background: linear-gradient(110deg, #c4b5fd, #a5b4fc, #7dd3fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        html[data-theme="aurora"][data-mode="light"] .error-code {
            background: linear-gradient(110deg, #4f46e5, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        /*
          Kolor komunikatu rozbity na tryby: #ef4444 na jasnych tłach dawało ~3.3:1
          (poniżej WCAG AA 4.5:1). Teraz ciemniejsza czerwień w trybie jasnym (~6:1)
          i jaśniejsza w ciemnym (~6.8:1). Treść komunikatu bez zmian.
        */
        .error-sub { color: #b91c1c; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1rem; margin-bottom: 1.5rem; }
        html[data-mode="dark"] .error-sub { color: #f87171; }
        .shoe-icon { display: flex; align-items: center; justify-content: center; height: 5rem; width: 5rem; margin-bottom: 1.5rem; color: var(--accent); }
        .shoe-icon svg { height: 4rem; width: 4rem; overflow: visible; filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent)); }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 relative text-center">

    <!-- Background decoration (CSS-controlled per theme) -->
    <div class="bg-decoration" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="cyber-grid"></div>
        <div class="cyber-scanlines"></div>
        <div class="cyber-glow"></div>
        <div class="cyber-sun"></div>
    </div>

    <main class="panel-card max-w-lg p-8 sm:p-12 z-10 w-full flex flex-col items-center relative">
        <div class="shoe-icon shoe-fly" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- Clean horizontal speed trail behind heel -->
                <path d="M 4 28 H 8 M 2 34 H 7 M 4 40 H 8" stroke-width="2" opacity="0.5"/>

                <!-- Sneaker body fill background -->
                <path d="M 14 42 V 20 C 14 15.5 17.5 12 22 12 C 25.5 12 28 14.5 29 18 L 34 24 C 38 26.5 43 28 48 29.5 C 52 30.5 54 32.5 54 36 C 54 39.5 52 42 48 42 H 14 Z" fill="currentColor" fill-opacity="0.12"/>

                <!-- Sneaker main outline -->
                <path d="M 14 42 V 20 C 14 15.5 17.5 12 22 12 C 25.5 12 28 14.5 29 18 L 34 24 C 38 26.5 43 28 48 29.5 C 52 30.5 54 32.5 54 36 C 54 39.5 52 42 48 42 H 14 Z" stroke-width="2.6"/>

                <!-- Flush, perfectly aligned sole unit -->
                <path d="M 11 42 H 53 C 55.5 42 57 43.5 56.5 46 C 55.5 48.5 52 50 47 50 H 17 C 12 50 9.5 48.5 9.5 46 C 9.5 43.5 11 42 11 42 Z" fill="currentColor" fill-opacity="0.25" stroke-width="2.6"/>

                <!-- Air Bubble Window -->
                <rect x="15" y="44.5" width="9" height="3.5" rx="1.75" fill="currentColor" fill-opacity="0.6" stroke="none"/>

                <!-- Speed Swoosh -->
                <path d="M 18 34 Q 29 34 38 27.5 Q 31 38 18 38 Z" fill="currentColor" opacity="0.85" stroke="none"/>

                <!-- Laces -->
                <line x1="27" y1="19" x2="32" y2="17" stroke-width="2"/>
                <line x1="29" y1="23" x2="35" y2="21" stroke-width="2"/>
                <line x1="32" y1="27" x2="38" y2="25" stroke-width="2"/>

                <!-- Ankle badge -->
                <circle cx="21" cy="20" r="2.8" fill="currentColor" stroke="none"/>

                <!-- Sparkles in flight -->
                <path d="M 57 18 L 58 20.5 L 60.5 21.5 L 58 22.5 L 57 25 L 56 22.5 L 53.5 21.5 L 56 20.5 Z" fill="currentColor" stroke="none"/>
                <circle cx="50" cy="14" r="1.5" fill="currentColor" stroke="none"/>
            </svg>
        </div>

        <p class="error-code">404</p>
        <p class="error-sub">UPOŚLEDZENIE W STOPNIU KRYTYCZNYM</p>

        <h1 class="text-xl sm:text-2xl font-bold mb-4">Ups! But odleciał za daleko.</h1>

        <p class="text-sm leading-relaxed mb-8 max-w-sm muted">
            Strona, której szukasz, prawdopodobnie została zrzucona z kiblem na telefon lub po prostu nie istnieje.
        </p>

        <a href="https://wikdra.top" class="theme-btn py-3 px-6 text-sm" style="text-decoration:none">
            Wróć na ziemię
        </a>
    </main>
</body>
</html>
