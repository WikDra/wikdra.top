<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - But odleciał | Wikdra.top</title>
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/app-v6.css">
    <style>
        .shoe-fly {
            animation: fly 5s infinite ease-in-out;
            transform-origin: center center;
        }
        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-16px) rotate(-12deg) scale(1.06); }
            50% { transform: translateY(-28px) rotate(10deg) scale(1.12); }
            75% { transform: translateY(-10px) rotate(-6deg) scale(1.04); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .shoe-fly { animation: none; } }
        .error-code { font-size: clamp(4rem, 15vw, 7rem); font-weight: 900; line-height: 1; }
        html[data-theme="cyberpunk"][data-mode="dark"] .error-code { color: var(--accent); text-shadow: 0 0 15px rgba(34,211,238,0.6); }
        html[data-theme="aurora"][data-mode="dark"] .error-code {
            background: linear-gradient(110deg, #c4b5fd, #a5b4fc, #7dd3fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        html[data-theme="aurora"][data-mode="light"] .error-code {
            background: linear-gradient(110deg, #4f46e5, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .error-sub { color: #ef4444; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1rem; margin-bottom: 1.5rem; }
        .shoe-icon { display: flex; align-items: center; justify-content: center; height: 4.5rem; width: 4.5rem; margin-bottom: 1rem; color: var(--accent); }
        .shoe-icon svg { height: 3.2rem; width: 3.2rem; filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent)); }
    </style>
    <script>
        (function () {
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i].trim();
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            }
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            let theme = getCookie('global_theme') || localStorage.getItem('global_theme') || (isDark ? 'terminal' : 'brutalist');
            let mode = getCookie('global_mode') || localStorage.getItem('global_mode');
            if (!mode) {
                mode = (getCookie('global_theme') || localStorage.getItem('global_theme'))
                    ? ((theme === 'brutalist' || theme === 'editorial') ? 'light' : 'dark')
                    : (isDark ? 'dark' : 'light');
            }
            const el = document.documentElement;
            el.dataset.theme = theme;
            el.dataset.mode = mode;
        })();
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 relative text-center">

    <!-- Background decoration (CSS-controlled per theme) -->
    <div class="bg-decoration" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="cyber-grid"></div>
        <div class="cyber-scanlines"></div>
        <div class="cyber-glow"></div>
        <div class="cyber-sun"></div>
    </div>

    <div class="panel-card max-w-lg p-8 sm:p-12 z-10 w-full flex flex-col items-center relative">
        <div class="shoe-icon shoe-fly" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 16h15c.6 0 1-.4 1-1v-2c0-1.1-.9-2-2-2h-3l-2.5-4.5A2 2 0 0 0 10.75 5.5H7.5A1.5 1.5 0 0 0 6 7v5H4a2 2 0 0 0-2 2v1c0 .6.4 1 1 1z"/>
                <path d="M2 16v2a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2"/>
                <path d="M8 8h3"/>
                <path d="M7.5 10.5h4"/>
            </svg>
        </div>

        <div class="error-code">404</div>
        <div class="error-sub">UPOŚLEDZENIE W STOPNIU KRYTYCZNYM</div>

        <h1 class="text-xl sm:text-2xl font-bold mb-4">Ups! But odleciał za daleko.</h1>

        <p class="text-sm leading-relaxed mb-8 max-w-sm muted">
            Strona, której szukasz, prawdopodobnie została zrzucona z kiblem na telefon lub po prostu nie istnieje.
        </p>

        <a href="https://wikdra.top" class="theme-btn py-3 px-6 text-sm" style="text-decoration:none">
            Wróć na ziemię
        </a>
    </div>
</body>
</html>
