<!DOCTYPE html>
<html lang="pl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - But odleciał | Wikdra.top</title>
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="/assets/css/app-v6.css">
    <style>
        .shoe-fly {
            animation: fly 4s infinite ease-in-out;
            transform-origin: center center;
        }
        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-14px) rotate(-8deg); }
            50% { transform: translateY(-24px) rotate(4deg); }
            75% { transform: translateY(-10px) rotate(-4deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) { .shoe-fly { animation: none; } }
        .error-code { font-size: clamp(4rem, 15vw, 7rem); font-weight: 900; line-height: 1; }
        html[data-theme="cyberpunk"][data-mode="dark"] .error-code { color: var(--accent); text-shadow: 0 0 15px rgba(34,211,238,0.6); }
        html[data-theme="aurora"][data-mode="dark"] .error-code {
            background: linear-gradient(110deg, #c4b5fd, #a5b4fc, #7dd3fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        html[data-theme="aurora"][data-mode="light"] .error-code {
            background: linear-gradient(110deg, #4f46e5, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .error-sub { color: #ef4444; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1rem; margin-bottom: 1.5rem; }
        .shoe-icon { display: flex; align-items: center; justify-content: center; height: 5rem; width: 5rem; margin-bottom: 1.5rem; color: var(--accent); }
        .shoe-icon svg { height: 4rem; width: 4rem; overflow: visible; filter: drop-shadow(0 4px 12px color-mix(in srgb, var(--accent) 40%, transparent)); }
    </style>
    <script>
        (function () {
            function getCookie(name) {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i].trim();
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            }
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            let theme = getCookie('global_theme') || localStorage.getItem('global_theme') || (isDark ? 'terminal' : 'brutalist');
            let mode = getCookie('global_mode') || localStorage.getItem('global_mode');
            if (!mode) {
                mode = (getCookie('global_theme') || localStorage.getItem('global_theme'))
                    ? ((theme === 'brutalist' || theme === 'editorial') ? 'light' : 'dark')
                    : (isDark ? 'dark' : 'light');
            }
            const el = document.documentElement;
            el.dataset.theme = theme;
            el.dataset.mode = mode;
        })();
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 relative text-center">

    <!-- Background decoration (CSS-controlled per theme) -->
    <div class="bg-decoration" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="cyber-grid"></div>
        <div class="cyber-scanlines"></div>
        <div class="cyber-glow"></div>
        <div class="cyber-sun"></div>
    </div>

    <div class="panel-card max-w-lg p-8 sm:p-12 z-10 w-full flex flex-col items-center relative">
        <div class="shoe-icon shoe-fly" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- Heel trail -->
                <path d="M 3 24 C 0 24 -2 27 0 29 C 2 31 -1 35 1 37 C 3 39 0 42 3 42" stroke-dasharray="2 3" opacity="0.4"/>
                
                <!-- Sneaker body fill background -->
                <path d="M 12 38 V 20 C 12 15.5 15.5 12 20 12 C 23.5 12 26 14.5 27 18 L 32 24 C 37 26 43 27.5 49 28.5 C 55 29.5 60 31 61 35 C 62 39 58 42 52 42 H 12 Z" fill="currentColor" fill-opacity="0.12"/>
                
                <!-- Sneaker main outline -->
                <path d="M 12 38 V 20 C 12 15.5 15.5 12 20 12 C 23.5 12 26 14.5 27 18 L 32 24 C 37 26 43 27.5 49 28.5 C 55 29.5 60 31 61 35 C 62 39 58 42 52 42 H 12 Z" stroke-width="2.6"/>
                
                <!-- Sole unit -->
                <path d="M 8 42 H 56 C 59.5 42 61 44.5 59.5 47.5 C 58 50 54 51 48 51 H 16 C 10 51 6 49.5 4.5 47 C 3 44.5 4.5 42 8 42 Z" fill="currentColor" fill-opacity="0.25" stroke-width="2.6"/>
                
                <!-- Air Bubble Window -->
                <rect x="14" y="44.5" width="10" height="4" rx="2" fill="currentColor" fill-opacity="0.6" stroke="none"/>
                
                <!-- Speed Swoosh -->
                <path d="M 16 34 Q 28 34 38 27 Q 30 38 16 38 Z" fill="currentColor" opacity="0.85" stroke="none"/>
                
                <!-- Laces -->
                <line x1="25" y1="19" x2="30" y2="17" stroke-width="2"/>
                <line x1="27" y1="23" x2="33" y2="21" stroke-width="2"/>
                <line x1="30" y1="27" x2="37" y2="25" stroke-width="2"/>
                
                <!-- Ankle badge -->
                <circle cx="20" cy="20" r="3" fill="currentColor" stroke="none"/>
                
                <!-- Sparkles in flight -->
                <path d="M 58 18 L 59 21 L 62 22 L 59 23 L 58 26 L 57 23 L 54 22 L 57 21 Z" fill="currentColor" stroke="none"/>
                <circle cx="50" cy="14" r="1.5" fill="currentColor" stroke-none"/>
            </svg>
        </div>

        <div class="error-code">404</div>
        <div class="error-sub">UPOŚLEDZENIE W STOPNIU KRYTYCZNYM</div>

        <h1 class="text-xl sm:text-2xl font-bold mb-4">Ups! But odleciał za daleko.</h1>

        <p class="text-sm leading-relaxed mb-8 max-w-sm muted">
            Strona, której szukasz, prawdopodobnie została zrzucona z kiblem na telefon lub po prostu nie istnieje.
        </p>

        <a href="https://wikdra.top" class="theme-btn py-3 px-6 text-sm" style="text-decoration:none">
            Wróć na ziemię
        </a>
    </div>
</body>
</html>
