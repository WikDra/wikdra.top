# CI: usługa Go (server/: testy, build, test na Alpine z OpenRC i nginx) oraz strona (kontrole, test UI
# w Chrome, także Bichu na zbudowanej binarce). Artefakt wikdra-linux-amd64 pobiera scripts/deploy-api.ps1.
name: CI

on:
  push:
    branches: [main, go-api]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: serwer Go (testy, build, Alpine)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true # najnowsza łatka bezpieczeństwa do binarki na serwer
          cache-dependency-path: server/go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Pliki do sformatowania (gofmt -w):"; echo "$out"; exit 1; fi

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build linux/amd64 (statyczny)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          version="${ref}-${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o .build/wikdra .
          file .build/wikdra | tee /dev/stderr | grep -q 'statically linked'
          (cd .build && sha256sum wikdra > wikdra.sha256)
          echo "$(du -h .build/wikdra | cut -f1) · $(cat .build/wikdra.sha256) · $(.build/wikdra version)"

      - name: shellcheck
        working-directory: server/deploy
        run: shellcheck -s sh -S warning wikdra-deploy install.sh test/ci-test.sh

      # Ten sam system co na serwerze: instalacja, wdrożenia z powrotem, hasło Bichu, nginx/default.conf z repo.
      - name: Test na Alpine (OpenRC, nginx, wdrożenia)
        env:
          CGO_ENABLED: '0'
        run: |
          w="$RUNNER_TEMP/wikdra"
          mkdir -p "$w"
          for n in 1 2 3 4; do go build -trimpath -ldflags "-s -w -X main.version=ci-$n" -o "$w/wikdra-ci-$n" .; done
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$w:/work" alpine:3.23 sh /src/server/deploy/test/ci-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wikdra-linux-amd64
          path: |
            server/.build/wikdra
            server/.build/wikdra.sha256
          retention-days: 30

  site:
    name: strona (kontrole, test UI)
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wikdra-linux-amd64
          path: server/.build

      - run: chmod +x server/.build/wikdra

      - run: npm ci

      - name: Kontrole (node --check, CSS bajt w bajt, reguły treści)
        run: npm run check

      - name: Test UI (Chrome; Bichu na binarce z joba server)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          WIKDRA_BIN: server/.build/wikdra
        run: npm run smoke
