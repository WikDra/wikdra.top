# ============================================================================
#  wikdra.top — JEDYNY kanoniczny szablon Nginx (Alpine / Mikrus)
#
#  Docelowa lokalizacja na serwerze: /etc/nginx/http.d/default.conf
#  Wcześniej w repo leżały trzy szablony (combined.conf, panele.conf,
#  default.conf.new), a na serwerze dodatkowo test.conf bez obsługi PHP,
#  który oddawał źródła .php i bichu_config.php jako pliki statyczne.
#  Zostaje jeden blok server dla wszystkich hostów = jedna polityka.
#
#  UWAGA (pułapka nginksa): `add_header` w bloku `location` UNIEWAŻNIA wszystkie
#  `add_header` z `server`. Dlatego Cache-Control jest wyliczany mapą i ustawiany
#  razem z nagłówkami bezpieczeństwa w JEDNYM miejscu — inaczej strony HTML
#  (mające własny cache) traciły nagłówki bezpieczeństwa.
#
#  Wdrożenie:
#     sudo cp nginx/default.conf /etc/nginx/http.d/default.conf
#     sudo nginx -t && sudo rc-service nginx reload
# ============================================================================

# Limit tempa dla PHP (bichu.php / stats.php). Musi być w kontekście http —
# ten plik jest włączany przez nginx.conf wewnątrz bloku http, więc jest OK.
limit_req_zone $binary_remote_addr zone=php_zone:10m rate=5r/s;

# Hosty dzielą jeden katalog; różnią się tylko stroną startową.
# test.wikdra.top jest tu CELOWO — wcześniej miał osobny plik bez blokad.
map $host $root_page {
    default             /index.html;
    panele.wikdra.top   /panels.html;
    test.wikdra.top     /panels.html;
}

# Polityka cache wyliczana z URI (pierwsze pasujące wyrażenie wygrywa).
# Pusta wartość = nginx NIE dodaje nagłówka; dla .php zostaje `no-store`
# ustawiane przez sam skrypt (inaczej odpowiedź miała dwa różne Cache-Control).
#
# CSS/JS/ikony celowo `no-cache` (czyli: waliduj przed użyciem), a nie max-age:
# przy `max-age=86400` Cloudflare trzymał starą kopię app-v6.css i po wdrożeniu
# poprawki strona nadal pokazywała stary wygląd (potwierdzone: origin 92001 B,
# CDN 91972 B, CF-Cache-Status HIT). Koszt to tanie 304, a szybkość i tryb
# offline zapewnia i tak Service Worker, który trzyma te pliki w Cache Storage.
# Fonty zostają na rok — nigdy się nie zmieniają pod tą samą nazwą.
map $uri $cache_control {
    default                             "no-cache";
    "~\.php$"                           "";
    "~^/assets/fonts/.*\.woff2$"        "public, max-age=31536000, immutable";
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

server {
    listen 80;
    listen [::]:80;
    server_name wikdra.top www.wikdra.top panele.wikdra.top test.wikdra.top;
    root /var/lib/nginx/html;

    # ——— nagłówki: jedno miejsce, żaden location ich nie nadpisuje ———
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # ——— strona startowa zależna od hosta ———
    location = / {
        try_files $root_page =404;
    }

    # ——— pliki, które nigdy nie mogą wyjść na świat ———
    location = /bichu_config.php    { return 404; }
    location = /bichu_content.txt   { return 404; }
    location = /bichu_attempts.json { return 404; }
    location ~ /\.                  { deny all; return 404; }   # .git, .env, .htaccess…

    # ——— trasy aplikacji ———
    location /bichu {
        try_files $uri $uri/ /bichu.php?$query_string;
    }

    # Wąska powierzchnia PHP: tylko dwa realnie istniejące skrypty.
    location ~ ^/(bichu|stats)\.php$ {
        limit_req zone=php_zone burst=10 nodelay;
        include fastcgi.conf;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 15s;
    }

    # Każdy inny .php nie jest naszym plikiem — nie oddajemy go ani jako kod, ani jako tekst.
    location ~ \.php$ { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
