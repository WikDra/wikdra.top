# ============================================================================
#  wikdra.top — JEDYNY kanoniczny szablon Nginx (Alpine / Mikrus)
#
#  Docelowa lokalizacja na serwerze: /etc/nginx/http.d/default.conf
#  Wcześniej w repo leżały trzy szablony (combined.conf, panele.conf,
#  default.conf.new), a na serwerze dodatkowo test.conf bez obsługi PHP,
#  który oddawał źródła .php i bichu_config.php jako pliki statyczne.
#  Zostaje jeden blok server dla wszystkich hostów = jedna polityka.
#
#  Strona to pliki statyczne z site/. Dwie dynamiczne trasy (/stats.php i /bichu)
#  obsługuje usługa Go `wikdra` (server/, 127.0.0.1:8092) — PHP tu już nie ma.
#
#  UWAGA (pułapka nginksa): `add_header` w bloku `location` UNIEWAŻNIA wszystkie
#  `add_header` z `server`. Dlatego Cache-Control jest wyliczany mapą i ustawiany
#  razem z nagłówkami bezpieczeństwa w JEDNYM miejscu — inaczej strony HTML
#  (mające własny cache) traciły nagłówki bezpieczeństwa.
#
#  Wdrożenie: pwsh scripts/deploy-api.ps1 -Nginx  (kopia, nginx -t, reload, powrót przy błędzie)
#         albo scripts\deploy.bat --with-nginx
# ============================================================================

# Limit tempa dla tras usługi Go (/stats.php, /bichu). Musi być w kontekście http —
# ten plik jest włączany przez nginx.conf wewnątrz bloku http, więc jest OK.
limit_req_zone $binary_remote_addr zone=wikdra_api:10m rate=5r/s;

# Hosty dzielą jeden katalog; różnią się tylko stroną startową.
# test.wikdra.top jest tu CELOWO — wcześniej miał osobny plik bez blokad.
map $host $root_page {
    default             /index.html;
    panele.wikdra.top   /panels.html;
    test.wikdra.top     /panels.html;
}

# Polityka cache wyliczana z URI (pierwsze pasujące wyrażenie wygrywa).
# Pusta wartość = nginx NIE dodaje nagłówka; dla tras Go zostaje `no-store`
# ustawiane przez usługę (inaczej odpowiedź miałaby dwa różne Cache-Control).
#
# CSS/JS/ikony celowo `no-cache` (czyli: waliduj przed użyciem), a nie max-age:
# przy `max-age=86400` Cloudflare trzymał starą kopię app-v6.css i po wdrożeniu
# poprawki strona nadal pokazywała stary wygląd (potwierdzone: origin 92001 B,
# CDN 91972 B, CF-Cache-Status HIT). Koszt to tanie 304, a szybkość i tryb
# offline zapewnia i tak Service Worker, który trzyma te pliki w Cache Storage.
# Fonty zostają na rok — nigdy się nie zmieniają pod tą samą nazwą.
map $uri $cache_control {
    default                             "no-cache";
    "~\.php$"                           "";
    "~^/bichu"                          "";
    "~^/assets/fonts/.*\.woff2$"        "public, max-age=31536000, immutable";
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

server {
    listen 80;
    listen [::]:80;
    server_name wikdra.top www.wikdra.top panele.wikdra.top test.wikdra.top;
    root /var/lib/nginx/html;

    # ——— prawdziwy adres klienta zza Cloudflare (limit_req, limit prób Bichu i logi liczą
    #     odwiedzających, nie serwery Cloudflare). Lista jak w proj.conf, z cloudflare.com/ips ———
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ——— nagłówki: jedno miejsce, żaden location ich nie nadpisuje ———
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # ——— strona startowa zależna od hosta ———
    location = / {
        try_files $root_page =404;
    }

    location ~ /\.                  { deny all; return 404; }   # .git, .env, .htaccess…

    # ——— trasy usługi Go `wikdra` (127.0.0.1:8092) ———
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;      # Go ufa mu tylko z 127.0.0.1
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    limit_req_status 429;

    location = /stats.php {
        limit_req zone=wikdra_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8092;
    }

    # /bichu, /bichu/, /bichu.php (strona i ?api=1). ^~: przed regułami regex poniżej, więc także
    # pozostałości po PHP (bichu_config.php, bichu_content.txt…) trafiają do Go, który zwraca 404.
    location ^~ /bichu {
        limit_req zone=wikdra_api burst=10 nodelay;
        client_max_body_size 300k;
        proxy_pass http://127.0.0.1:8092;
    }

    # Każdy inny .php nie jest naszym plikiem — nie oddajemy go ani jako kod, ani jako tekst.
    location ~ \.php$ { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
